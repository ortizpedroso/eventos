# Deploy automatizado no VPS via SSH (secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY).
# Dispara manualmente em Actions ou após merge na branch de deploy.

name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch a publicar no VPS
        required: false
        default: cursor/recover-whatsapp-admin-126d
      script:
        description: Script de deploy
        required: false
        default: deploy-vps-automatico.sh

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/eventosbr
            git fetch origin "${{ github.event.inputs.branch }}"
            export EVENTOSBR_DEPLOY_BRANCH="${{ github.event.inputs.branch }}"
            bash scripts/${{ github.event.inputs.script }}
